<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 5 – Inventions | B1</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b42;font:16px/1.55 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:20px}header{background:#143e61;color:white;padding:28px;border-radius:18px}h1{margin:4px 0;font-size:clamp(25px,5vw,38px)}h2{margin:0}small{font-size:13px}input{font:inherit;padding:10px;border:1px solid #94a3b8;border-radius:8px;width:100%;background:white;color:#172b42}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:#176b83;color:white}button:disabled{opacity:.5;cursor:default}.secondary{background:#e2e8f0;color:#172b42}.bar{position:sticky;top:0;background:#fff;padding:12px;z-index:3;border:1px solid #dbe4ed;border-radius:12px;margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}progress{flex:1;min-width:80px;accent-color:#168092}nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}section,.panel{background:white;border-radius:14px;padding:20px;margin:14px 0;border:1px solid #dbe4ed}.q{border-top:1px solid #e2e8f0;padding:14px 0}.q p{margin:0 0 8px}.chips,.chosen{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.chosen{min-height:48px;border:1px dashed #94a3b8;padding:7px;border-radius:8px}.chips button{background:#e4eff5;color:#143e61}.chosen button{background:#176b83}.feedback{margin-top:8px;font-size:14px}.right{color:#12643d}.wrong{color:#a12c36}.hidden{display:none!important}.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}#result{border-left:5px solid #176b83}a{color:#176b83}@media(max-width:550px){main{padding:10px}section,.panel{padding:14px}.fields{grid-template-columns:1fr}}@media print{.bar,nav,.actions,#start{display:none!important}section{break-inside:auto}.q{break-inside:avoid}body{background:white}}</style><main><header><small>ENGLISH 10 • GLOBAL SUCCESS • B1</small><h1>UNIT 5 – INVENTIONS</h1>Interactive Vocabulary & Grammar Checklist<br>50 questions · 50 minutes · 10 points</header><div class="panel"><div class="fields"><label>Student name<input id="student" placeholder="Full name"></label><label>Class<input id="className" placeholder="Class"></label></div><p>Complete all five exercises. Each correct answer earns 0.2 points. Tick the confidence box if you can answer without help.</p><button id="start">Start test / Bắt đầu</button></div><div id="test" class="hidden"><div class="bar"><strong id="clock">50:00</strong><progress id="progress" max="50" value="0"></progress><span id="count">0/50 answered</span></div><nav id="nav"></nav><div id="questions"></div><div class="actions"><button id="submit">Submit & grade</button><button id="reset" class="secondary">Try again</button></div><div id="result" class="panel hidden" aria-live="polite"></div></div></main><script>
const data=[["English → Vietnamese", "Translate into Vietnamese.", [["artificial intelligence", "trí tuệ nhân tạo"], ["storage space", "dung lượng lưu trữ|không gian lưu trữ"], ["three-dimensional object", "vật thể ba chiều|vật thể 3 chiều"], ["powerful processor", "bộ xử lý mạnh|bộ xử lí mạnh|bộ xử lý mạnh mẽ"], ["portable device", "thiết bị dễ mang theo|thiết bị di động|thiết bị cầm tay"], ["carry out research", "tiến hành nghiên cứu|thực hiện nghiên cứu"], ["recognize emotions", "nhận diện cảm xúc|nhận biết cảm xúc|nhận ra cảm xúc"], ["a source of inspiration", "nguồn cảm hứng|một nguồn cảm hứng"], ["make scientific discoveries", "thực hiện những khám phá khoa học|thực hiện các khám phá khoa học|có những phát hiện khoa học"], ["develop global communication", "phát triển giao tiếp toàn cầu|phát triển truyền thông toàn cầu"]]], ["Vietnamese → English", "Translate into English.", [["Phần cứng máy tính", "computer hardware"], ["Cài đặt phần mềm", "install software|install the software"], ["Ô tô không người lái", "driverless cars|driverless car|a driverless car|self-driving cars|self-driving car"], ["Tiến hành thí nghiệm", "conduct an experiment|carry out an experiment|do an experiment|perform an experiment"], ["Sạc pin", "charge the battery|charge a battery|charge batteries"], ["Thiết bị đọc sách điện tử", "e-book reader|e-reader|ebook reader|an e-book reader|an e-reader"], ["Hiển thị thông tin", "display information|show information"], ["Tiết kiệm thời gian", "save time"], ["Công nghệ in 3D", "3D printing technology|3-D printing technology"], ["Giao tiếp với người khác", "communicate with others|communicate with other people"]]], ["Missing words & verb forms", "Complete each blank. Use the correct form where indicated.", [["Scientists are carrying ______ research into artificial intelligence.", "out"], ["This application enables users to communicate ______ people around the world.", "with"], ["Modern technology allows us to work more ______. (EFFECT)", "effectively"], ["The ______ of the smartphone has changed the way we communicate. (INVENT)", "invention"], ["This laptop has enough storage ______ for all my documents.", "space"], ["Scientists ______ many useful devices so far. (DEVELOP)", "have developed"], ["My brother ______ the new software yet. (NOT INSTALL)", "has not installed|hasn’t installed|hasn't installed"], ["I have used this laptop ______ three years.", "for"], ["Technology has developed rapidly since I ______ school. (START)", "started"], ["This is the first time I ______ a 3D printer. (USE)", "have used"], ["The engineers have decided ______ a more powerful processor. (DEVELOP)", "to develop"], ["Many students enjoy ______ educational applications. (USE)", "using"], ["This device allows people ______ information easily. (STORE)", "to store"], ["If the application does not work, try ______ your computer. (RESTART)", "restarting"], ["I look forward to ______ the latest inventions at the exhibition. (SEE)", "seeing"]]], ["Jumbled letters", "Unscramble the letters using the clue.", [["T I N V E N O I N — Something new that has been created", "invention"], ["W A R E S O F T — Programs used by a computer", "software"], ["C E S P R O S O R — A part that processes information", "processor"], ["B O R A L A T O R Y — A place for scientific experiments", "laboratory"], ["E N I C V O N E N T — Easy or suitable for a situation", "convenient"]]], ["Sentence rearrangement", "Select the phrases in the correct order. Click a selected phrase to undo it.", [["artificial intelligence / scientists / have / for many years / studied", "Scientists have studied artificial intelligence for many years|For many years scientists have studied artificial intelligence"], ["allows / this application / users / to communicate / with each other", "This application allows users to communicate with each other"], ["to install / it / ten minutes / takes / the software / me", "It takes me ten minutes to install the software"], ["too expensive / this device / is / to buy / for most students", "This device is too expensive for most students to buy"], ["powerful enough / the processor / is / to run / this software", "The processor is powerful enough to run this software"], ["it / I / difficult / find / to use / this application", "I find it difficult to use this application"], ["using / my grandfather / is used to / electronic devices", "My grandfather is used to using electronic devices"], ["to charge / before leaving home / remember / your laptop", "Remember to charge your laptop before leaving home|Before leaving home remember to charge your laptop"], ["is worth / this device / because / buying / it saves time", "This device is worth buying because it saves time|Because it saves time this device is worth buying"], ["the most useful invention / this is / I / have ever / used", "This is the most useful invention I have ever used"]]]];let items=[],answers=[],confidence=[],locked=false,timer=null,deadline=0;const $=id=>document.getElementById(id);const norm=s=>s.normalize('NFC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]/g,'').trim().replace(/\s+/g,' ');function el(tag,txt,cls){let e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}function render(){items=[];answers=[];confidence=[];$('questions').replaceChildren();$('nav').replaceChildren();data.forEach(([title,desc,qs],si)=>{let sec=el('section');sec.id='s'+si;sec.append(el('h2',`${si+1}. ${title} (${qs.length} items)`),el('p',desc));let link=el('button',`Ex ${si+1}`,'secondary');link.onclick=()=>sec.scrollIntoView({behavior:'smooth',block:'start'});$('nav').append(link);qs.forEach(([prompt,key])=>{let i=items.length;items.push({prompt,key,si});answers.push('');confidence.push(false);let q=el('div',null,'q');q.append(el('p',`${i+1}. ${si===4?'Arrange the phrases:':prompt}`));if(si===4){let phrases=prompt.split(' / '),selected=[];let pool=el('div',null,'chips'),chosen=el('div',null,'chosen');function draw(){pool.replaceChildren();chosen.replaceChildren();phrases.forEach((p,j)=>{if(!selected.includes(j)){let b=el('button',p);b.disabled=locked;b.onclick=()=>{selected.push(j);draw()};pool.append(b)}});selected.forEach((j,k)=>{let b=el('button',phrases[j]);b.disabled=locked;b.onclick=()=>{selected.splice(k,1);draw()};chosen.append(b)});answers[i]=selected.map(j=>phrases[j]).join(' ');update()}q.append(pool,chosen);draw()}else{let inp=el('input');inp.placeholder='Your answer';inp.setAttribute('aria-label',`Answer ${i+1}`);inp.autocomplete='off';inp.oninput=()=>{answers[i]=inp.value;update()};q.append(inp)}let label=el('label');let ck=el('input');ck.type='checkbox';ck.style.width='auto';ck.onchange=()=>confidence[i]=ck.checked;label.append(ck,document.createTextNode(' I can do this independently'));q.append(label);let fb=el('div',null,'feedback');fb.id='fb'+i;q.append(fb);sec.append(q)});$('questions').append(sec)});update()}
function update(){let n=answers.filter(a=>a.trim()).length;$('progress').value=n;$('count').textContent=n+'/50 answered'}function tick(){let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s)grade(true)}function start(){locked=false;render();$('test').classList.remove('hidden');$('result').classList.add('hidden');$('submit').disabled=false;$('start').disabled=true;deadline=Date.now()+50*60000;clearInterval(timer);timer=setInterval(tick,250);tick()}function grade(auto=false){if(locked)return;if(!auto&&!confirm('Submit your answers?'))return;locked=true;clearInterval(timer);let scores=[0,0,0,0,0];items.forEach((it,i)=>{let ok=it.key.split('|').some(a=>norm(a)===norm(answers[i]));if(ok)scores[it.si]++;let f=$('fb'+i);f.className='feedback '+(ok?'right':'wrong');f.textContent=(ok?'✓ Correct':'✗ '+(answers[i].trim()?'Check your answer':'Unanswered'))+' — Suggested answer: '+it.key.split('|')[0]});$('questions').querySelectorAll('input,button').forEach(e=>e.disabled=true);$('submit').disabled=true;let total=scores.reduce((a,b)=>a+b,0);let r=$('result');r.replaceChildren(el('h2',`Result: ${(total/5).toFixed(1)}/10`),el('p',`${$('student').value||'Student'} · ${$('className').value||'Class'} · ${total}/50 correct · ${confidence.filter(Boolean).length}/50 confident`));scores.forEach((v,i)=>r.append(el('p',`${data[i][0]}: ${v}/${data[i][2].length}`)));r.append(el('p','Equivalent translations not listed in the answer key may require teacher review. Review the feedback under each question.'));let b=el('button','Print / Save PDF','secondary');b.onclick=()=>window.print();r.append(b);r.classList.remove('hidden');r.scrollIntoView({behavior:'smooth'})}$('start').onclick=start;$('submit').onclick=()=>grade();$('reset').onclick=()=>{if(confirm('Clear all answers and restart?'))start()};</script></html>
